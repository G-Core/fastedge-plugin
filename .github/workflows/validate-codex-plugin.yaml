name: Validate Codex Plugin

# Runs scripts/validate-codex-plugin.sh on PRs that touch the Codex plugin,
# its marketplace entry, or the shared docs-index source corpus.
#
# docs-index.json is a generated artifact (gitignored, regenerated by
# release-plugin.yml on release). We regenerate it here before validation
# so its referenced markdown paths and section line ranges are checked
# against the PR's current tree.

on:
  pull_request:
    paths:
      - "plugins/gcore-fastedge-codex/**"
      - ".agents/plugins/marketplace.json"
      - "plugins/gcore-fastedge/skills/fastedge-docs/reference/**"
      - "plugins/gcore-fastedge/skills/test/reference/**"
      - "scripts/validate-codex-plugin.sh"
      - "scripts/sync/generate-docs-index.mjs"
      - "scripts/sync/generate-docs-index.sh"
      - "scripts/sync/reference-skills.json"
      - ".github/workflows/validate-codex-plugin.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-codex-plugin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: ./.github/setup-node

      - name: Regenerate docs-index.json
        run: bash scripts/sync/generate-docs-index.sh

      - name: Validate Codex plugin wiring
        run: bash scripts/validate-codex-plugin.sh
