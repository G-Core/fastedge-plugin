name: "Setup Node.js"
description: "Sets up the Node.js environment."
inputs:
  node_version:
    description: "Node.js version to use"
    required: false
    default: "24.12.0"

runs:
  using: "composite"
  steps:
    - name: Use Node.js ${{ inputs.node_version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node_version }}
